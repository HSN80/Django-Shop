{% extends 'base.html' %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center text-center">
        <div class="col-lg-6">
            <!-- Icon -->
            <div class="mb-4">
                <i class="bi bi-shield-lock text-danger" style="font-size: 5rem;"></i>
            </div>
            <!-- Error Code & Title -->
            <h1 class="display-1 fw-bold text-dark mb-2">403</h1>
            <h2 class="h4 mb-3 fw-semibold">Access Forbidden</h2>
            <!-- Description -->
            <p class="text-muted mb-4">
                You do not have permission to view this page or resource. Please log in with an authorized account or return to the homepage.
            </p>
            <!-- Actions -->
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'products:Catalog_list' %}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house-door me-2"></i> Back to Home
                </a>
                <a href="javascript:history.back();" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-arrow-left me-2"></i> Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
